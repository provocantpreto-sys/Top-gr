name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Criar o projeto (inclui baixar o snes9x)
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # Cria a pasta "TopGear" com o projeto Android completo (incluindo o core snes9x).
          # Precisa de: Python 3, git e internet.
          # Uso: python3 criar_projeto.py   (depois: Android Studio > File > Open > pasta TopGear)
          import os, subprocess, sys
          FILES = {
              "README.md": "# Top Gear Android (wrapper nativo + snes9x)\n\nApp Android (Kotlin + C++17/JNI) com o core **snes9x** (via API libretro) embutido.\nVídeo na `Surface`, áudio com Oboe, pad virtual multitoque, suporte a controle físico,\nsaves (SRAM) automáticos e memória da última ROM.\n\n## O que o app faz\n1. Na primeira vez, pede o arquivo da ROM (`.sfc`/`.smc`); nas próximas abre direto.\n2. O botão **ROM** no topo troca de jogo.\n3. O save do jogo é gravado a cada ~30 s e ao sair do app.\n\nA ROM **não** acompanha o app: use um backup do seu próprio cartucho.\n\n## Estrutura\n- `app/src/main/cpp/frontend.*`  frontend libretro portátil (vídeo, áudio, entrada, SRAM)\n- `app/src/main/cpp/native-lib.cpp`  ponte JNI + `ANativeWindow` + Oboe\n- `app/src/main/cpp/host_test.cpp`  teste de ponta a ponta no PC (mini-ROM de teste)\n- `app/src/main/cpp/snes9x/`  código do snes9x, baixado na versão fixa do `criar_projeto.py`\n- `app/src/main/java/.../MainActivity.kt`  UI, toque e controle\n\nMapeamento de entrada: o pad vira a palavra `($4219<<8)|$4218` (bits do SNES); o snes9x\na entrega ao jogo pela leitura automática do joypad, como no hardware.\n\n## Compilar o APK\n**Android Studio:** File > Open na pasta do projeto, aguarde o sync (baixa NDK/CMake) e Run.\nO APK sai em `app/build/outputs/apk/debug/`.\n\n**GitHub Actions:** envie o projeto (ou só o `build-apk.yml`) e baixe o APK em Actions > Artifacts.\n\n**Teste no PC (sem Android):**\n\n    cmake -S app/src/main/cpp -B build -G Ninja -DTOPGEAR_HOST_TEST=ON -DCMAKE_BUILD_TYPE=Release\n    cmake --build build && ./build/host_test\n\n## Licenças\nO snes9x usa licença própria que **não permite uso comercial**. Este projeto serve para\nuso pessoal. Oboe: Apache 2.0.\n",
              "app/build.gradle.kts": "plugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n}\n\nandroid {\n    namespace = \"com.example.topgear\"\n    compileSdk = 35\n\n    defaultConfig {\n        applicationId = \"com.example.topgear\"\n        minSdk = 24\n        targetSdk = 35\n        versionCode = 1\n        versionName = \"1.0\"\n\n        ndk {\n            abiFilters += listOf(\"arm64-v8a\", \"armeabi-v7a\")\n        }\n        externalNativeBuild {\n            cmake {\n                cppFlags += \"-std=c++17\"\n                // Oboe (Prefab) exige o mesmo STL compartilhado\n                arguments += \"-DANDROID_STL=c++_shared\"\n            }\n        }\n    }\n\n    buildFeatures {\n        prefab = true            // permite find_package(oboe) no CMake\n    }\n\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n            // Assina com a chave de debug para o APK de release instalar direto no aparelho.\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }\n    }\n\n    externalNativeBuild {\n        cmake {\n            path = file(\"src/main/cpp/CMakeLists.txt\")\n            version = \"3.22.1\"\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n}\n\ndependencies {\n    implementation(\"androidx.core:core-ktx:1.15.0\")\n    implementation(\"androidx.appcompat:appcompat:1.7.0\")\n    implementation(\"com.google.oboe:oboe:1.9.0\")\n}\n",
              "app/src/main/AndroidManifest.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\n    <application\n        android:allowBackup=\"false\"\n        android:label=\"@string/app_name\"\n        android:theme=\"@style/Theme.TopGear\">\n\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:screenOrientation=\"sensorLandscape\"\n            android:configChanges=\"orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n",
              "app/src/main/cpp/CMakeLists.txt": "cmake_minimum_required(VERSION 3.22.1)\nproject(\"topgear\" LANGUAGES C CXX)\n\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\nset(CMAKE_CXX_EXTENSIONS OFF)\nset(CMAKE_POSITION_INDEPENDENT_CODE ON)\n\n# Emulação precisa de código otimizado mesmo em build \"debug\" (-O0 não roda a 60 fps).\nset(CMAKE_C_FLAGS_DEBUG   \"-O2 -g0\")\nset(CMAKE_CXX_FLAGS_DEBUG \"-O2 -g0\")\nset(CMAKE_C_FLAGS_RELEASE   \"-O2 -DNDEBUG -ffunction-sections -fdata-sections\")\nset(CMAKE_CXX_FLAGS_RELEASE \"-O2 -DNDEBUG -ffunction-sections -fdata-sections\")\n\noption(TOPGEAR_HOST_TEST \"Compila o teste de ponta a ponta para o computador (sem Android)\" OFF)\n\n# ---------------------------------------------------------------------------\n# Core snes9x (código-fonte em ./snes9x, baixado pelo criar_projeto.py / workflow).\n# A lista de arquivos espelha snes9x/libretro/Makefile.common.\n# ---------------------------------------------------------------------------\nset(S9X ${CMAKE_CURRENT_SOURCE_DIR}/snes9x)\nif(NOT EXISTS ${S9X}/libretro/libretro.cpp)\n    message(FATAL_ERROR\n        \"Código do snes9x não encontrado em ${S9X}.\\n\"\n        \"Rode criar_projeto.py (ele baixa o snes9x) ou clone https://github.com/snes9xgit/snes9x em app/src/main/cpp/snes9x\")\nendif()\n\nset(S9X_SOURCES\n    ${S9X}/filter/snes_ntsc.c\n    ${S9X}/apu/apu.cpp\n    ${S9X}/apu/bapu/dsp/sdsp.cpp\n    ${S9X}/apu/bapu/smp/smp.cpp\n    ${S9X}/apu/bapu/smp/smp_state.cpp\n    ${S9X}/bsx.cpp\n    ${S9X}/c4.cpp\n    ${S9X}/c4emu.cpp\n    ${S9X}/cheats.cpp\n    ${S9X}/cheats2.cpp\n    ${S9X}/clip.cpp\n    ${S9X}/conffile.cpp\n    ${S9X}/controls.cpp\n    ${S9X}/cpu.cpp\n    ${S9X}/cpuexec.cpp\n    ${S9X}/cpuops.cpp\n    ${S9X}/crosshairs.cpp\n    ${S9X}/dma.cpp\n    ${S9X}/dsp.cpp\n    ${S9X}/dsp1.cpp\n    ${S9X}/dsp2.cpp\n    ${S9X}/dsp3.cpp\n    ${S9X}/dsp4.cpp\n    ${S9X}/fxinst.cpp\n    ${S9X}/fxemu.cpp\n    ${S9X}/gfx.cpp\n    ${S9X}/globals.cpp\n    ${S9X}/memmap.cpp\n    ${S9X}/obc1.cpp\n    ${S9X}/msu1.cpp\n    ${S9X}/ppu.cpp\n    ${S9X}/stream.cpp\n    ${S9X}/sa1.cpp\n    ${S9X}/sa1cpu.cpp\n    ${S9X}/screenshot.cpp\n    ${S9X}/sdd1.cpp\n    ${S9X}/sdd1emu.cpp\n    ${S9X}/seta.cpp\n    ${S9X}/seta010.cpp\n    ${S9X}/seta011.cpp\n    ${S9X}/seta018.cpp\n    ${S9X}/snapshot.cpp\n    ${S9X}/snes9x.cpp\n    ${S9X}/spc7110.cpp\n    ${S9X}/srtc.cpp\n    ${S9X}/tile.cpp\n    ${S9X}/tileimpl-n1x1.cpp\n    ${S9X}/tileimpl-n2x1.cpp\n    ${S9X}/tileimpl-h2x1.cpp\n    ${S9X}/sha256.cpp\n    ${S9X}/bml.cpp\n    ${S9X}/movie.cpp\n    ${S9X}/fscompat.cpp\n    ${S9X}/libretro/libretro.cpp\n)\n\nadd_library(snes9x_core STATIC ${S9X_SOURCES})\ntarget_include_directories(snes9x_core PUBLIC\n    ${S9X}/libretro\n    ${S9X}/libretro/libretro-common/include\n    ${S9X}\n    ${S9X}/apu\n    ${S9X}/apu/bapu)\ntarget_compile_definitions(snes9x_core PUBLIC\n    __LIBRETRO__ HAVE_STRINGS_H RIGHTSHIFT_IS_SAR\n    $<$<BOOL:${ANDROID}>:ANDROID>)\ntarget_compile_options(snes9x_core PRIVATE -w)   # silencia avisos do código de terceiros\n\n# ---------------------------------------------------------------------------\n# Frontend portátil (vídeo/áudio/entrada/saves)\n# ---------------------------------------------------------------------------\nadd_library(frontend STATIC frontend.cpp)\ntarget_link_libraries(frontend PUBLIC snes9x_core)\ntarget_compile_options(frontend PRIVATE -Wall -Wextra)\n\nif(TOPGEAR_HOST_TEST)\n    add_executable(host_test host_test.cpp)\n    target_link_libraries(host_test PRIVATE frontend)\nelse()\n    # ---- Biblioteca Android: libtopgear.so ----\n    find_package(oboe REQUIRED CONFIG)   # Oboe via Prefab (dependência Gradle)\n\n    add_library(topgear SHARED native-lib.cpp)\n    target_compile_options(topgear PRIVATE -Wall -Wextra -fvisibility=hidden)\n\n    find_library(log-lib     log)        # __android_log_print\n    find_library(android-lib android)    # ANativeWindow\n    find_library(egl-lib     EGL)\n    find_library(gles-lib    GLESv2)\n\n    target_link_libraries(topgear PRIVATE\n        frontend\n        oboe::oboe\n        ${android-lib} ${log-lib} ${egl-lib} ${gles-lib})\n\n    # Android 15+ (páginas de 16 KB) e remoção de seções mortas\n    target_link_options(topgear PRIVATE\n        \"-Wl,-z,max-page-size=16384\"\n        \"-Wl,--gc-sections\")\nendif()\n",
              "app/src/main/cpp/frontend.cpp": "// frontend.cpp — implementação do frontend libretro (veja frontend.h).\n\n#include \"frontend.h\"\n\n#include \"libretro.h\"\n\n#include <algorithm>\n#include <atomic>\n#include <cstdarg>\n#include <cstdio>\n#include <cstring>\n#include <vector>\n\nnamespace fe {\nnamespace {\n\n// ---------------------------------------------------------------------------\n// Estado\n// ---------------------------------------------------------------------------\nLogFn g_log = nullptr;\n\nstd::string g_sysDir, g_saveDir, g_srmPath;\nretro_pixel_format g_fmt = RETRO_PIXEL_FORMAT_0RGB1555;  // padrão do libretro\nbool g_inited = false;\nbool g_loaded = false;\nstd::vector<uint8_t> g_romCopy;\n\nstd::atomic<uint16_t> g_mask{0};\n\ndouble g_fps = 60.0988;\nint    g_rate = 32040;\n\nstd::vector<uint32_t> g_rgba;\nint  g_vw = 0, g_vh = 0;\nbool g_updated = false;\n\n// Ring buffer de áudio (potência de 2), produtor = thread de emulação,\n// consumidor = thread de áudio. Índices monotônicos de 64 bits.\nconstexpr size_t RING_FRAMES = 1u << 14;   // ~0,5 s a 32 kHz\nconstexpr size_t RING_MASK   = RING_FRAMES - 1;\nstd::vector<int16_t>  g_ring;\nstd::atomic<uint64_t> g_wr{0};\nstd::atomic<uint64_t> g_rd{0};\n\nstd::vector<uint8_t> g_sramShadow;\nuint32_t g_frameCount = 0;\n\nvoid logMsg(int level, const char* msg) {\n    if (g_log) g_log(level, msg);\n    else std::fprintf(stderr, \"[fe:%d] %s\", level, msg);\n}\n\n// ---------------------------------------------------------------------------\n// Callbacks libretro\n// ---------------------------------------------------------------------------\nvoid RETRO_CALLCONV cbLog(enum retro_log_level level, const char* fmt, ...) {\n    char buf[1024];\n    va_list ap;\n    va_start(ap, fmt);\n    std::vsnprintf(buf, sizeof(buf), fmt, ap);\n    va_end(ap);\n    logMsg(static_cast<int>(level), buf);\n}\n\nbool RETRO_CALLCONV cbEnvironment(unsigned cmd, void* data) {\n    switch (cmd) {\n        case RETRO_ENVIRONMENT_GET_CAN_DUPE:\n            *static_cast<bool*>(data) = true;           // aceita frames repetidos (data == NULL)\n            return true;\n        case RETRO_ENVIRONMENT_SET_PIXEL_FORMAT: {\n            const auto f = *static_cast<const retro_pixel_format*>(data);\n            if (f == RETRO_PIXEL_FORMAT_XRGB8888 || f == RETRO_PIXEL_FORMAT_RGB565 ||\n                f == RETRO_PIXEL_FORMAT_0RGB1555) {\n                g_fmt = f;\n                return true;\n            }\n            return false;\n        }\n        case RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY:\n        case RETRO_ENVIRONMENT_GET_SAVE_DIRECTORY:\n            *static_cast<const char**>(data) =\n                (cmd == RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY ? g_sysDir : g_saveDir).c_str();\n            return true;\n        case RETRO_ENVIRONMENT_GET_LOG_INTERFACE:\n            static_cast<retro_log_callback*>(data)->log = cbLog;\n            return true;\n        case RETRO_ENVIRONMENT_GET_VARIABLE:\n            static_cast<retro_variable*>(data)->value = nullptr;  // usa os padrões do core\n            return false;\n        case RETRO_ENVIRONMENT_GET_VARIABLE_UPDATE:\n            *static_cast<bool*>(data) = false;\n            return true;\n        case RETRO_ENVIRONMENT_GET_AUDIO_VIDEO_ENABLE:\n            *static_cast<int*>(data) = 3;               // vídeo + áudio ligados\n            return true;\n        case RETRO_ENVIRONMENT_SET_GEOMETRY:\n        case RETRO_ENVIRONMENT_SET_INPUT_DESCRIPTORS:\n        case RETRO_ENVIRONMENT_SET_CONTROLLER_INFO:\n        case RETRO_ENVIRONMENT_SET_PERFORMANCE_LEVEL:\n        case RETRO_ENVIRONMENT_SET_SUPPORT_ACHIEVEMENTS:\n        case RETRO_ENVIRONMENT_SET_SUBSYSTEM_INFO:\n        case RETRO_ENVIRONMENT_SET_CORE_OPTIONS_DISPLAY:\n            return true;\n        default:\n            return false;\n    }\n}\n\ninline uint32_t pack(uint32_t r, uint32_t g, uint32_t b) {\n    return 0xFF000000u | (b << 16) | (g << 8) | r;     // bytes: R,G,B,A (little-endian)\n}\n\nvoid RETRO_CALLCONV cbVideo(const void* data, unsigned w, unsigned h, size_t pitch) {\n    if (!data) { g_updated = true; return; }           // frame repetido: mantém o buffer\n    if (w == 0 || h == 0 || w > 1024 || h > 1024) return;\n\n    g_vw = static_cast<int>(w);\n    g_vh = static_cast<int>(h);\n    g_rgba.resize(static_cast<size_t>(w) * h);\n\n    const auto* src = static_cast<const uint8_t*>(data);\n    for (unsigned y = 0; y < h; ++y) {\n        uint32_t* dst = &g_rgba[static_cast<size_t>(y) * w];\n        const uint8_t* row = src + y * pitch;\n        switch (g_fmt) {\n            case RETRO_PIXEL_FORMAT_XRGB8888: {\n                const auto* p = reinterpret_cast<const uint32_t*>(row);\n                for (unsigned x = 0; x < w; ++x)\n                    dst[x] = pack((p[x] >> 16) & 0xFF, (p[x] >> 8) & 0xFF, p[x] & 0xFF);\n                break;\n            }\n            case RETRO_PIXEL_FORMAT_RGB565: {\n                const auto* p = reinterpret_cast<const uint16_t*>(row);\n                for (unsigned x = 0; x < w; ++x) {\n                    const uint32_t v = p[x];\n                    const uint32_t r = (v >> 11) & 31, g = (v >> 5) & 63, b = v & 31;\n                    dst[x] = pack((r << 3) | (r >> 2), (g << 2) | (g >> 4), (b << 3) | (b >> 2));\n                }\n                break;\n            }\n            default: {                                   // 0RGB1555\n                const auto* p = reinterpret_cast<const uint16_t*>(row);\n                for (unsigned x = 0; x < w; ++x) {\n                    const uint32_t v = p[x];\n                    const uint32_t r = (v >> 10) & 31, g = (v >> 5) & 31, b = v & 31;\n                    dst[x] = pack((r << 3) | (r >> 2), (g << 3) | (g >> 2), (b << 3) | (b >> 2));\n                }\n                break;\n            }\n        }\n    }\n    g_updated = true;\n}\n\nsize_t RETRO_CALLCONV cbAudioBatch(const int16_t* data, size_t frames) {\n    const uint64_t w = g_wr.load(std::memory_order_relaxed);\n    const uint64_t r = g_rd.load(std::memory_order_acquire);\n    const size_t space = RING_FRAMES - static_cast<size_t>(w - r);\n    const size_t n = std::min(frames, space);          // se encher, descarta o excedente\n    for (size_t i = 0; i < n; ++i) {\n        const size_t idx = static_cast<size_t>((w + i) & RING_MASK) * 2;\n        g_ring[idx]     = data[i * 2];\n        g_ring[idx + 1] = data[i * 2 + 1];\n    }\n    g_wr.store(w + n, std::memory_order_release);\n    return frames;\n}\n\nvoid RETRO_CALLCONV cbAudioSample(int16_t l, int16_t r) {\n    const int16_t s[2] = {l, r};\n    cbAudioBatch(s, 1);\n}\n\nvoid RETRO_CALLCONV cbInputPoll() {}\n\n// Ordem dos ids do joypad libretro -> bits do SNES.\nconstexpr uint16_t kJoyBit[12] = {\n    BTN_B, BTN_Y, BTN_SELECT, BTN_START, BTN_UP, BTN_DOWN,\n    BTN_LEFT, BTN_RIGHT, BTN_A, BTN_X, BTN_L, BTN_R,\n};\n\nint16_t RETRO_CALLCONV cbInputState(unsigned port, unsigned device, unsigned /*index*/, unsigned id) {\n    if (port != 0 || (device & RETRO_DEVICE_MASK) != RETRO_DEVICE_JOYPAD) return 0;\n    uint16_t m = g_mask.load(std::memory_order_relaxed);\n    // D-pad físico nunca tem direções opostas ao mesmo tempo.\n    if ((m & BTN_UP) && (m & BTN_DOWN))    m &= ~(BTN_UP | BTN_DOWN);\n    if ((m & BTN_LEFT) && (m & BTN_RIGHT)) m &= ~(BTN_LEFT | BTN_RIGHT);\n    if (id == RETRO_DEVICE_ID_JOYPAD_MASK) {\n        int16_t out = 0;\n        for (unsigned i = 0; i < 12; ++i) if (m & kJoyBit[i]) out |= static_cast<int16_t>(1u << i);\n        return out;\n    }\n    if (id >= 12) return 0;\n    return (m & kJoyBit[id]) ? 1 : 0;\n}\n\n// ---------------------------------------------------------------------------\n// SRAM\n// ---------------------------------------------------------------------------\nstd::string hashName(const uint8_t* d, size_t n) {\n    uint64_t h = 1469598103934665603ULL;               // FNV-1a 64 bits\n    for (size_t i = 0; i < n; ++i) { h ^= d[i]; h *= 1099511628211ULL; }\n    char buf[32];\n    std::snprintf(buf, sizeof(buf), \"%016llx\", static_cast<unsigned long long>(h));\n    return buf;\n}\n\nvoid loadSram() {\n    void* p = retro_get_memory_data(RETRO_MEMORY_SAVE_RAM);\n    const size_t n = retro_get_memory_size(RETRO_MEMORY_SAVE_RAM);\n    g_sramShadow.clear();\n    if (!p || n == 0) return;\n    if (FILE* f = std::fopen(g_srmPath.c_str(), \"rb\")) {\n        const size_t got = std::fread(p, 1, n, f);\n        std::fclose(f);\n        logMsg(1, \"SRAM carregada\\n\");\n        (void)got;\n    }\n    g_sramShadow.assign(static_cast<uint8_t*>(p), static_cast<uint8_t*>(p) + n);\n}\n\n} // namespace\n\n// ---------------------------------------------------------------------------\n// API pública\n// ---------------------------------------------------------------------------\nvoid setLogger(LogFn fn) { g_log = fn; }\n\nbool init(const std::string& systemDir, const std::string& saveDir) {\n    if (g_inited) return true;\n    g_sysDir = systemDir;\n    g_saveDir = saveDir;\n    g_ring.assign(RING_FRAMES * 2, 0);\n\n    // Ordem exigida pelo libretro: environment antes de retro_init.\n    retro_set_environment(cbEnvironment);\n    retro_init();\n    retro_set_video_refresh(cbVideo);\n    retro_set_audio_sample(cbAudioSample);\n    retro_set_audio_sample_batch(cbAudioBatch);\n    retro_set_input_poll(cbInputPoll);\n    retro_set_input_state(cbInputState);\n    g_inited = true;\n    return true;\n}\n\nvoid flushSram() {\n    if (!g_loaded) return;\n    void* p = retro_get_memory_data(RETRO_MEMORY_SAVE_RAM);\n    const size_t n = retro_get_memory_size(RETRO_MEMORY_SAVE_RAM);\n    if (!p || n == 0) return;\n    if (g_sramShadow.size() == n && std::memcmp(g_sramShadow.data(), p, n) == 0) return;\n    const std::string tmp = g_srmPath + \".tmp\";\n    if (FILE* f = std::fopen(tmp.c_str(), \"wb\")) {\n        const size_t wrote = std::fwrite(p, 1, n, f);\n        std::fclose(f);\n        if (wrote == n && std::rename(tmp.c_str(), g_srmPath.c_str()) == 0)\n            g_sramShadow.assign(static_cast<uint8_t*>(p), static_cast<uint8_t*>(p) + n);\n    }\n}\n\nvoid shutdown() {\n    if (g_loaded) { flushSram(); retro_unload_game(); g_loaded = false; }\n    if (g_inited) { retro_deinit(); g_inited = false; }\n}\n\nbool loadGame(const uint8_t* data, size_t size) {\n    if (!g_inited || !data || size < 0x8000) return false;\n    if (g_loaded) { flushSram(); retro_unload_game(); g_loaded = false; }\n\n    g_romCopy.assign(data, data + size);\n    g_srmPath = g_saveDir + \"/\" + hashName(data, size) + \".srm\";\n    g_wr.store(0); g_rd.store(0);\n    g_vw = g_vh = 0;\n    g_updated = false;\n    g_frameCount = 0;\n\n    retro_game_info info{};\n    info.path = \"game.sfc\";\n    info.data = g_romCopy.data();\n    info.size = g_romCopy.size();\n    info.meta = nullptr;\n    if (!retro_load_game(&info)) { logMsg(3, \"retro_load_game falhou\\n\"); return false; }\n    g_loaded = true;\n\n    retro_system_av_info av{};\n    retro_get_system_av_info(&av);\n    if (av.timing.fps > 20.0 && av.timing.fps < 120.0) g_fps = av.timing.fps;\n    if (av.timing.sample_rate > 8000.0) g_rate = static_cast<int>(av.timing.sample_rate + 0.5);\n\n    loadSram();\n    return true;\n}\n\nbool gameLoaded() { return g_loaded; }\n\nvoid setPad(uint16_t mask) { g_mask.store(mask, std::memory_order_relaxed); }\n\nvoid runFrame() {\n    if (!g_loaded) return;\n    g_updated = false;\n    retro_run();\n    if (++g_frameCount % 1800 == 0) flushSram();       // ~30 s: grava saves automaticamente\n}\n\nVideo video() { return Video{g_rgba.empty() ? nullptr : g_rgba.data(), g_vw, g_vh, g_updated}; }\n\nint sampleRate() { return g_rate; }\ndouble fps() { return g_fps; }\n\nsize_t readAudio(int16_t* dst, size_t frames) {\n    const uint64_t r = g_rd.load(std::memory_order_relaxed);\n    const uint64_t w = g_wr.load(std::memory_order_acquire);\n    const size_t n = std::min(frames, static_cast<size_t>(w - r));\n    for (size_t i = 0; i < n; ++i) {\n        const size_t idx = static_cast<size_t>((r + i) & RING_MASK) * 2;\n        dst[i * 2]     = g_ring[idx];\n        dst[i * 2 + 1] = g_ring[idx + 1];\n    }\n    g_rd.store(r + n, std::memory_order_release);\n    return n;\n}\n\n} // namespace fe\n",
              "app/src/main/cpp/frontend.h": "// frontend.h — frontend libretro portátil (sem dependências de Android).\n//\n// Fica entre o core snes9x (API libretro: retro_*) e a camada Android (native-lib.cpp):\n//   - recebe o vídeo do core e converte para RGBA8888\n//   - recebe o áudio do core e guarda num ring buffer lock-free (SPSC)\n//   - entrega ao core o estado dos botões (input_state)\n//   - carrega e grava a SRAM (saves do jogo) em disco\n//\n// Por não depender de Android, o mesmo código roda no teste de host (host_test.cpp).\n#pragma once\n\n#include <cstddef>\n#include <cstdint>\n#include <string>\n\nnamespace fe {\n\n// Máscara do pad no formato do SNES: palavra de 16 bits = ($4219 << 8) | $4218.\n//   $4218 JOY1L: bit7=A bit6=X bit5=L bit4=R   (bits 3-0 = 0)\n//   $4219 JOY1H: bit7=B bit6=Y bit5=Select bit4=Start bit3=Up bit2=Down bit1=Left bit0=Right\n// O snes9x lê estes botões via input_state e produz $4218/$4219 na leitura\n// automática do joypad (NMITIMEN $4200 bit 0), exatamente como o hardware.\nconstexpr uint16_t BTN_B      = 1u << 15;\nconstexpr uint16_t BTN_Y      = 1u << 14;\nconstexpr uint16_t BTN_SELECT = 1u << 13;\nconstexpr uint16_t BTN_START  = 1u << 12;\nconstexpr uint16_t BTN_UP     = 1u << 11;\nconstexpr uint16_t BTN_DOWN   = 1u << 10;\nconstexpr uint16_t BTN_LEFT   = 1u << 9;\nconstexpr uint16_t BTN_RIGHT  = 1u << 8;\nconstexpr uint16_t BTN_A      = 1u << 7;\nconstexpr uint16_t BTN_X      = 1u << 6;\nconstexpr uint16_t BTN_L      = 1u << 5;\nconstexpr uint16_t BTN_R      = 1u << 4;\n\n// Níveis: 0=debug 1=info 2=warn 3=error (mesmos do libretro).\nusing LogFn = void (*)(int level, const char* msg);\nvoid setLogger(LogFn fn);\n\nbool init(const std::string& systemDir, const std::string& saveDir);\nvoid shutdown();\n\n// Carrega a ROM (com ou sem header de copiador; o snes9x detecta sozinho).\n// Também carrega a SRAM salva anteriormente para esta ROM.\nbool loadGame(const uint8_t* data, size_t size);\nbool gameLoaded();\n\nvoid setPad(uint16_t mask);   // seguro de qualquer thread\nvoid runFrame();              // executa 1 frame de emulação\n\nstruct Video {\n    const uint32_t* rgba;     // RGBA8888 (bytes na memória: R,G,B,A)\n    int width;\n    int height;\n    bool updated;             // houve frame novo neste runFrame()\n};\nVideo video();\n\nint    sampleRate();          // normalmente 32040 Hz\ndouble fps();                 // ~60,0988 (NTSC) ou ~50,0070 (PAL)\n\n// Consumidor de áudio (thread do Oboe). Copia até `frames` quadros estéreo int16\n// intercalados; retorna quantos copiou. Lock-free.\nsize_t readAudio(int16_t* dst, size_t frames);\n\nvoid flushSram();             // grava a SRAM em disco se mudou\n\n} // namespace fe\n",
              "app/src/main/cpp/host_test.cpp": "// host_test.cpp — teste de ponta a ponta no computador (sem Android).\n// Monta um mini-ROM SNES (escrito em código de máquina 65c816) que mostra uma cor\n// de fundo vermelha, e verde enquanto o botão B estiver pressionado. Valida:\n// carga da ROM pelo snes9x, vídeo, áudio, taxa de quadros e mapeamento de entrada.\n//\n// Compilar: cmake -S . -B build -DTOPGEAR_HOST_TEST=ON && cmake --build build && ./build/host_test\n\n#include \"frontend.h\"\n\n#include <cstdio>\n#include <cstdlib>\n#include <vector>\n\nstatic std::vector<uint8_t> makeRom() {\n    std::vector<uint8_t> rom(0x8000, 0xFF);\n\n    const uint8_t code[] = {\n        0x78,                       // 00  SEI\n        0x18,                       // 01  CLC\n        0xFB,                       // 02  XCE            (modo nativo)\n        0xA9, 0x8F,                 // 03  LDA #$8F\n        0x8D, 0x00, 0x21,           // 05  STA $2100      (forced blank)\n        0xA9, 0x01,                 // 08  LDA #$01\n        0x8D, 0x00, 0x42,           // 0A  STA $4200      (auto-joypad read ligado)\n        0x9C, 0x2C, 0x21,           // 0D  STZ $212C      (nenhuma BG: só a cor de fundo)\n        0xA9, 0x0F,                 // 10  LDA #$0F\n        0x8D, 0x00, 0x21,           // 12  STA $2100      (tela ligada)\n        // L0 (0x15): espera sair do VBlank\n        0xAD, 0x12, 0x42,           // 15  LDA $4212\n        0x30, 0xFB,                 // 18  BMI L0\n        // L1 (0x1A): espera entrar no VBlank\n        0xAD, 0x12, 0x42,           // 1A  LDA $4212\n        0x10, 0xFB,                 // 1D  BPL L1\n        // L2 (0x1F): espera terminar a leitura automática do joypad\n        0xAD, 0x12, 0x42,           // 1F  LDA $4212\n        0x29, 0x01,                 // 22  AND #$01\n        0xD0, 0xF9,                 // 24  BNE L2\n        0xAD, 0x19, 0x42,           // 26  LDA $4219      (JOY1H: bit7 = B)\n        0x10, 0x0F,                 // 29  BPL notB\n        // B pressionado: fundo verde ($03E0)\n        0x9C, 0x21, 0x21,           // 2B  STZ $2121\n        0xA9, 0xE0,                 // 2E  LDA #$E0\n        0x8D, 0x22, 0x21,           // 30  STA $2122\n        0xA9, 0x03,                 // 33  LDA #$03\n        0x8D, 0x22, 0x21,           // 35  STA $2122\n        0x80, 0x0D,                 // 38  BRA end\n        // notB: fundo vermelho ($001F)\n        0x9C, 0x21, 0x21,           // 3A  STZ $2121\n        0xA9, 0x1F,                 // 3D  LDA #$1F\n        0x8D, 0x22, 0x21,           // 3F  STA $2122\n        0xA9, 0x00,                 // 42  LDA #$00\n        0x8D, 0x22, 0x21,           // 44  STA $2122\n        // end (0x47):\n        0x80, 0xCC,                 // 47  BRA L0\n    };\n    for (size_t i = 0; i < sizeof(code); ++i) rom[i] = code[i];\n\n    // Header LoROM em 0x7FC0\n    const char title[] = \"TOPGEAR HOST TEST     \";\n    for (int i = 0; i < 21; ++i) rom[0x7FC0 + i] = static_cast<uint8_t>(title[i]);\n    rom[0x7FD5] = 0x20;  // LoROM\n    rom[0x7FD6] = 0x00;\n    rom[0x7FD7] = 0x05;  // 32 KB\n    rom[0x7FD8] = 0x00;\n    rom[0x7FD9] = 0x01;  // NTSC\n    rom[0x7FDA] = 0x00;\n    rom[0x7FDB] = 0x00;\n    // Vetores: reset/NMI/IRQ/BRK/COP -> $8000\n    for (int off : {0x7FE4, 0x7FE6, 0x7FE8, 0x7FEA, 0x7FEE, 0x7FF4, 0x7FF6, 0x7FF8, 0x7FFA, 0x7FFC, 0x7FFE}) {\n        rom[off] = 0x00; rom[off + 1] = 0x80;\n    }\n    // Checksum\n    rom[0x7FDC] = rom[0x7FDD] = rom[0x7FDE] = rom[0x7FDF] = 0;\n    uint32_t sum = 0;\n    for (uint8_t b : rom) sum += b;\n    const uint16_t cs = sum & 0xFFFF, inv = static_cast<uint16_t>(~cs);\n    rom[0x7FDC] = inv & 0xFF; rom[0x7FDD] = inv >> 8;\n    rom[0x7FDE] = cs & 0xFF;  rom[0x7FDF] = cs >> 8;\n    return rom;\n}\n\nstatic void logger(int level, const char* msg) { std::printf(\"  [core %d] %s\", level, msg); }\n\nstatic int fails = 0;\n#define CHECK(cond, ...) do { if (cond) std::printf(\"  ok:   \" __VA_ARGS__); \\\n    else { std::printf(\"  FAIL: \" __VA_ARGS__); ++fails; } std::printf(\"\\n\"); } while (0)\n\nstatic uint32_t centerPixel(const fe::Video& v) {\n    return v.rgba[(v.height / 2) * v.width + v.width / 2];\n}\n\nint main() {\n    fe::setLogger(logger);\n    std::system(\"mkdir -p /tmp/topgear_host_test\");\n    CHECK(fe::init(\"/tmp/topgear_host_test\", \"/tmp/topgear_host_test\"), \"init do core\");\n\n    auto rom = makeRom();\n    CHECK(fe::loadGame(rom.data(), rom.size()), \"loadGame\");\n    CHECK(fe::gameLoaded(), \"jogo carregado\");\n    std::printf(\"  av: %.4f fps, %d Hz\\n\", fe::fps(), fe::sampleRate());\n    CHECK(fe::sampleRate() == 32040, \"sample rate 32040 Hz\");\n    CHECK(fe::fps() > 60.0 && fe::fps() < 60.2, \"fps NTSC\");\n\n    // Sem botões: fundo vermelho.\n    fe::setPad(0);\n    size_t audioFrames = 0;\n    std::vector<int16_t> abuf(4096 * 2);\n    for (int i = 0; i < 20; ++i) {\n        fe::runFrame();\n        audioFrames += fe::readAudio(abuf.data(), 4096);\n    }\n    fe::Video v = fe::video();\n    CHECK(v.rgba && v.width >= 256 && v.height >= 224, \"video %dx%d\", v.width, v.height);\n    uint32_t p = centerPixel(v);\n    const uint32_t r = p & 0xFF, g = (p >> 8) & 0xFF, b = (p >> 16) & 0xFF;\n    CHECK(r > 200 && g < 30 && b < 30, \"sem botoes: fundo vermelho (pixel=%08X)\", p);\n    CHECK(audioFrames > 20 * 500, \"audio gerado (%zu quadros em 20 frames)\", audioFrames);\n\n    // Botão B: fundo verde (prova o caminho toque -> máscara -> $4219).\n    fe::setPad(fe::BTN_B);\n    for (int i = 0; i < 20; ++i) { fe::runFrame(); fe::readAudio(abuf.data(), 4096); }\n    p = centerPixel(fe::video());\n    const uint32_t r2 = p & 0xFF, g2 = (p >> 8) & 0xFF, b2 = (p >> 16) & 0xFF;\n    CHECK(g2 > 200 && r2 < 30 && b2 < 30, \"botao B: fundo verde (pixel=%08X)\", p);\n\n    // Soltou: volta ao vermelho.\n    fe::setPad(0);\n    for (int i = 0; i < 20; ++i) { fe::runFrame(); fe::readAudio(abuf.data(), 4096); }\n    p = centerPixel(fe::video());\n    CHECK((p & 0xFF) > 200 && ((p >> 8) & 0xFF) < 30, \"soltou B: vermelho de novo (pixel=%08X)\", p);\n\n    fe::shutdown();\n    std::printf(fails ? \"\\nRESULTADO: %d FALHA(S)\\n\" : \"\\nRESULTADO: TUDO OK\\n\", fails);\n    return fails ? 1 : 0;\n}\n",
              "app/src/main/cpp/native-lib.cpp": "// native-lib.cpp — ponte JNI entre a UI Kotlin e o frontend libretro (snes9x).\n//\n// Fluxo:\n//   Kotlin (MainActivity) --JNI--> Java_com_example_topgear_MainActivity_*\n//     nativeInit(sysDir, saveDir)  : inicializa o core snes9x\n//     nativeLoadRom(bytes)         : carrega ROM + SRAM\n//     nativeSetSurface(surface)    : Surface -> ANativeWindow (vídeo)\n//     nativeSetInput(mask)         : máscara do pad virtual -> $4218/$4219\n//     nativeStart / nativeStop     : thread de emulação + áudio (Oboe)\n//\n// O nome de cada função JNI segue: Java_<pacote com _>_<Classe>_<método>.\n// Se mudar o pacote ou a classe no Kotlin, renomeie as funções aqui.\n\n#include <jni.h>\n#include <android/log.h>\n#include <android/native_window.h>\n#include <android/native_window_jni.h>\n\n#include <cstring>   // antes do Oboe: alguns cabeçalhos dele usam memset sem incluir\n\n#include <oboe/Oboe.h>\n\n#include <atomic>\n#include <chrono>\n#include <memory>\n#include <mutex>\n#include <string>\n#include <thread>\n\n#include \"frontend.h\"\n\n#define LOG_TAG \"TopGearNative\"\n#define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)\n#define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)\n\nnamespace {\n\nstd::atomic<bool> g_running{false};\nstd::thread       g_thread;\n\nstd::mutex      g_winMutex;       // protege g_window (surface destroy vs. blit)\nANativeWindow*  g_window = nullptr;\nint             g_lastW = 0, g_lastH = 0;\n\nstd::shared_ptr<oboe::AudioStream> g_stream;\n\n// ---------------------------------------------------------------------------\n// Áudio (Oboe): o callback puxa do ring buffer do frontend. Sem locks nem alocação.\n// ---------------------------------------------------------------------------\nclass AudioCallback final : public oboe::AudioStreamDataCallback {\npublic:\n    oboe::DataCallbackResult onAudioReady(oboe::AudioStream*, void* audioData,\n                                          int32_t numFrames) override {\n        auto* out = static_cast<int16_t*>(audioData);\n        const size_t got = fe::readAudio(out, static_cast<size_t>(numFrames));\n        if (got < static_cast<size_t>(numFrames))        // underrun: completa com silêncio\n            std::memset(out + got * 2, 0, (static_cast<size_t>(numFrames) - got) * 2 * sizeof(int16_t));\n        return oboe::DataCallbackResult::Continue;\n    }\n};\n\nvoid startAudio(int sampleRate) {\n    oboe::AudioStreamBuilder b;\n    b.setDirection(oboe::Direction::Output)\n        ->setPerformanceMode(oboe::PerformanceMode::LowLatency)\n        ->setSharingMode(oboe::SharingMode::Shared)\n        ->setFormat(oboe::AudioFormat::I16)\n        ->setChannelCount(oboe::ChannelCount::Stereo)\n        ->setSampleRate(sampleRate)                       // 32040 Hz do SPC700\n        ->setSampleRateConversionQuality(oboe::SampleRateConversionQuality::Medium)\n        ->setUsage(oboe::Usage::Game)\n        ->setDataCallback(std::make_shared<AudioCallback>());\n    const oboe::Result r = b.openStream(g_stream);\n    if (r != oboe::Result::OK) { LOGE(\"Oboe openStream: %s\", oboe::convertToText(r)); g_stream.reset(); return; }\n    g_stream->requestStart();\n}\n\nvoid stopAudio() {\n    if (g_stream) { g_stream->stop(); g_stream->close(); g_stream.reset(); }\n}\n\n// ---------------------------------------------------------------------------\n// Vídeo: copia o RGBA do core para a Surface. O tamanho do buffer segue o do core\n// (256x224, 512x448 em alta resolução, 256x239 PAL...); o compositor escala.\n// ---------------------------------------------------------------------------\nvoid blit(const fe::Video& v) {\n    if (!v.rgba || v.width <= 0 || v.height <= 0) return;\n    std::lock_guard<std::mutex> lk(g_winMutex);\n    if (!g_window) return;\n    if (v.width != g_lastW || v.height != g_lastH) {\n        ANativeWindow_setBuffersGeometry(g_window, v.width, v.height, WINDOW_FORMAT_RGBA_8888);\n        g_lastW = v.width;\n        g_lastH = v.height;\n    }\n    ANativeWindow_Buffer buf;\n    if (ANativeWindow_lock(g_window, &buf, nullptr) != 0) return;\n    auto* dst = static_cast<uint32_t*>(buf.bits);\n    const int rows = buf.height < v.height ? buf.height : v.height;\n    const int cols = buf.width  < v.width  ? buf.width  : v.width;\n    for (int y = 0; y < rows; ++y)\n        std::memcpy(dst + static_cast<size_t>(y) * buf.stride,\n                    v.rgba + static_cast<size_t>(y) * v.width,\n                    static_cast<size_t>(cols) * sizeof(uint32_t));\n    ANativeWindow_unlockAndPost(g_window);\n}\n\nvoid emulationLoop() {\n    using clock = std::chrono::steady_clock;\n    const auto period = std::chrono::duration_cast<clock::duration>(\n        std::chrono::duration<double>(1.0 / fe::fps()));     // ~16,64 ms (NTSC)\n    auto next = clock::now();\n    while (g_running.load(std::memory_order_acquire)) {\n        fe::runFrame();\n        const fe::Video v = fe::video();\n        if (v.updated) blit(v);\n        next += period;\n        std::this_thread::sleep_until(next);\n        // Se atrasou muito (app pausado, CPU ocupada), ressincroniza em vez de acelerar.\n        if (clock::now() - next > std::chrono::milliseconds(100)) next = clock::now();\n    }\n}\n\nvoid stopAll() {\n    g_running.store(false, std::memory_order_release);\n    if (g_thread.joinable()) g_thread.join();\n    stopAudio();\n    fe::flushSram();   // grava o save do jogo sempre que a emulação para\n}\n\nvoid androidLog(int level, const char* msg) {\n    static const int prio[] = {ANDROID_LOG_DEBUG, ANDROID_LOG_INFO, ANDROID_LOG_WARN, ANDROID_LOG_ERROR};\n    __android_log_print(prio[level < 0 ? 0 : (level > 3 ? 3 : level)], \"snes9x\", \"%s\", msg);\n}\n\nstd::string jstr(JNIEnv* env, jstring s) {\n    if (!s) return {};\n    const char* c = env->GetStringUTFChars(s, nullptr);\n    std::string out = c ? c : \"\";\n    if (c) env->ReleaseStringUTFChars(s, c);\n    return out;\n}\n\n} // namespace\n\n// ---------------------------------------------------------------------------\n// Funções JNI (MainActivity.kt: external fun ...)\n// Tipos: Int->jint, Boolean->jboolean, String->jstring, ByteArray->jbyteArray.\n// ---------------------------------------------------------------------------\nextern \"C\" {\n\nJNIEXPORT jboolean JNICALL\nJava_com_example_topgear_MainActivity_nativeInit(JNIEnv* env, jobject, jstring sysDir, jstring saveDir) {\n    fe::setLogger(androidLog);\n    const bool ok = fe::init(jstr(env, sysDir), jstr(env, saveDir));\n    LOGI(\"Core snes9x inicializado: %d\", ok);\n    return ok ? JNI_TRUE : JNI_FALSE;\n}\n\nJNIEXPORT jboolean JNICALL\nJava_com_example_topgear_MainActivity_nativeLoadRom(JNIEnv* env, jobject, jbyteArray rom) {\n    if (!rom) return JNI_FALSE;\n    stopAll();                                   // nunca troca a ROM com a emulação rodando\n    const jsize len = env->GetArrayLength(rom);\n    // GetByteArrayElements pode copiar; JNI_ABORT descarta a cópia sem escrever de volta.\n    jbyte* bytes = env->GetByteArrayElements(rom, nullptr);\n    if (!bytes) return JNI_FALSE;\n    const bool ok = fe::loadGame(reinterpret_cast<const uint8_t*>(bytes), static_cast<size_t>(len));\n    env->ReleaseByteArrayElements(rom, bytes, JNI_ABORT);\n    if (!ok) LOGE(\"Falha ao carregar ROM (%d bytes)\", static_cast<int>(len));\n    return ok ? JNI_TRUE : JNI_FALSE;\n}\n\nJNIEXPORT void JNICALL\nJava_com_example_topgear_MainActivity_nativeSetSurface(JNIEnv* env, jobject, jobject surface) {\n    std::lock_guard<std::mutex> lk(g_winMutex);\n    if (g_window) { ANativeWindow_release(g_window); g_window = nullptr; }\n    g_lastW = g_lastH = 0;                       // força reaplicar o tamanho do buffer\n    if (surface) g_window = ANativeWindow_fromSurface(env, surface);\n}\n\n// Chamada a cada mudança de toque: só um store atômico (sem locks nem alocação),\n// seguro para a thread de UI. O snes9x lê a máscara em input_state() e gera\n// $4218/$4219 na leitura automática do joypad.\nJNIEXPORT void JNICALL\nJava_com_example_topgear_MainActivity_nativeSetInput(JNIEnv*, jobject, jint mask) {\n    fe::setPad(static_cast<uint16_t>(mask));\n}\n\nJNIEXPORT void JNICALL\nJava_com_example_topgear_MainActivity_nativeStart(JNIEnv*, jobject) {\n    if (!fe::gameLoaded()) return;\n    if (g_running.exchange(true)) return;\n    startAudio(fe::sampleRate());\n    g_thread = std::thread(emulationLoop);\n}\n\nJNIEXPORT void JNICALL\nJava_com_example_topgear_MainActivity_nativeStop(JNIEnv*, jobject) {\n    stopAll();\n}\n\nJNIEXPORT void JNICALL\nJava_com_example_topgear_MainActivity_nativeDestroy(JNIEnv*, jobject) {\n    stopAll();\n    fe::shutdown();\n}\n\n} // extern \"C\"\n",
              "app/src/main/java/com/example/topgear/MainActivity.kt": "package com.example.topgear\n\nimport android.content.Context\nimport android.content.Intent\nimport android.content.pm.ActivityInfo\nimport android.graphics.Canvas\nimport android.graphics.Color\nimport android.graphics.Paint\nimport android.net.Uri\nimport android.os.Bundle\nimport android.view.Gravity\nimport android.view.KeyEvent\nimport android.view.MotionEvent\nimport android.view.SurfaceHolder\nimport android.view.SurfaceView\nimport android.view.View\nimport android.view.ViewGroup\nimport android.widget.FrameLayout\nimport android.widget.Toast\nimport androidx.activity.result.contract.ActivityResultContracts\nimport androidx.appcompat.app.AppCompatActivity\nimport androidx.core.view.WindowCompat\nimport androidx.core.view.WindowInsetsCompat\nimport androidx.core.view.WindowInsetsControllerCompat\n\n/**\n * Bits do pad no formato do SNES: palavra de 16 bits = ($4219 shl 8) or $4218.\n * Devem ser idênticos às constantes BTN_* em frontend.h.\n */\nobject Snes {\n    const val B = 1 shl 15\n    const val Y = 1 shl 14\n    const val SELECT = 1 shl 13\n    const val START = 1 shl 12\n    const val UP = 1 shl 11\n    const val DOWN = 1 shl 10\n    const val LEFT = 1 shl 9\n    const val RIGHT = 1 shl 8\n    const val A = 1 shl 7\n    const val X = 1 shl 6\n    const val L = 1 shl 5\n    const val R = 1 shl 4\n}\n\n/** Botão virtual em coordenadas normalizadas (0..1) para funcionar em qualquer tela. */\nprivate class VButton(val mask: Int, val label: String, val cx: Float, val cy: Float, val r: Float)\n\n/** Layout do pad virtual + hit-test. Raio normalizado pela menor dimensão da view. */\nprivate class VirtualPad {\n    var w = 1f\n    var h = 1f\n    val buttons = listOf(\n        // D-pad (esquerda)\n        VButton(Snes.UP, \"▲\", 0.13f, 0.52f, 0.075f),\n        VButton(Snes.DOWN, \"▼\", 0.13f, 0.84f, 0.075f),\n        VButton(Snes.LEFT, \"◀\", 0.06f, 0.68f, 0.075f),\n        VButton(Snes.RIGHT, \"▶\", 0.20f, 0.68f, 0.075f),\n        // Botões de ação (direita)\n        VButton(Snes.A, \"A\", 0.94f, 0.68f, 0.085f),\n        VButton(Snes.B, \"B\", 0.85f, 0.82f, 0.085f),\n        VButton(Snes.X, \"X\", 0.85f, 0.54f, 0.085f),\n        VButton(Snes.Y, \"Y\", 0.76f, 0.68f, 0.085f),\n        // Ombros e menu\n        VButton(Snes.L, \"L\", 0.07f, 0.18f, 0.08f),\n        VButton(Snes.R, \"R\", 0.93f, 0.18f, 0.08f),\n        VButton(Snes.SELECT, \"SEL\", 0.42f, 0.92f, 0.055f),\n        VButton(Snes.START, \"START\", 0.58f, 0.92f, 0.055f),\n    )\n\n    /** Botão \"ROM\" no topo: abre o seletor de jogo (não gera input do SNES). */\n    val menu = VButton(0, \"ROM\", 0.5f, 0.08f, 0.05f)\n\n    fun radiusPx(b: VButton) = b.r * minOf(w, h)\n\n    private fun inside(b: VButton, x: Float, y: Float, scale: Float): Boolean {\n        val dx = x - b.cx * w\n        val dy = y - b.cy * h\n        val rr = radiusPx(b) * scale\n        return dx * dx + dy * dy <= rr * rr\n    }\n\n    fun isMenu(x: Float, y: Float) = inside(menu, x, y, 1.2f)\n\n    /** Retorna a máscara de todos os botões sob o ponto (permite deslizar entre botões). */\n    fun hit(x: Float, y: Float): Int {\n        var m = 0\n        for (b in buttons) if (inside(b, x, y, 1.25f)) m = m or b.mask\n        return m\n    }\n}\n\n/** Overlay que só desenha os botões (não consome toques: eles chegam à Activity). */\nprivate class PadOverlay(ctx: Context, private val pad: VirtualPad) : View(ctx) {\n    var pressed = 0\n    private val fill = Paint(Paint.ANTI_ALIAS_FLAG)\n    private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {\n        color = Color.WHITE; textAlign = Paint.Align.CENTER\n    }\n\n    override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {\n        pad.w = w.toFloat(); pad.h = h.toFloat()\n    }\n\n    private fun drawButton(c: Canvas, b: VButton, on: Boolean) {\n        fill.color = if (on) 0xAAFFFFFF.toInt() else 0x44FFFFFF\n        val r = pad.radiusPx(b)\n        c.drawCircle(b.cx * width, b.cy * height, r, fill)\n        text.textSize = r * 0.7f\n        c.drawText(b.label, b.cx * width, b.cy * height + r * 0.25f, text)\n    }\n\n    override fun onDraw(c: Canvas) {\n        for (b in pad.buttons) drawButton(c, b, (pressed and b.mask) != 0)\n        drawButton(c, pad.menu, false)\n    }\n}\n\nclass MainActivity : AppCompatActivity(), SurfaceHolder.Callback {\n\n    // --- Ponte JNI ---------------------------------------------------------\n    // Cada \"external fun\" corresponde a Java_com_example_topgear_MainActivity_<nome>\n    // em native-lib.cpp. Tipos: Int->jint, String->jstring, ByteArray->jbyteArray.\n    private external fun nativeInit(systemDir: String, saveDir: String): Boolean\n    private external fun nativeLoadRom(rom: ByteArray): Boolean\n    private external fun nativeSetSurface(surface: android.view.Surface?)\n    private external fun nativeSetInput(mask: Int)\n    private external fun nativeStart()\n    private external fun nativeStop()\n    private external fun nativeDestroy()\n\n    companion object {\n        init {\n            // Carrega libtopgear.so (nome definido em add_library no CMakeLists.txt)\n            System.loadLibrary(\"topgear\")\n        }\n        private const val PREFS = \"topgear\"\n        private const val KEY_ROM = \"rom_uri\"\n    }\n\n    private val pad = VirtualPad()\n    private lateinit var overlay: PadOverlay\n    private lateinit var surfaceView: SurfaceView\n    private var touchMask = 0\n    private var keyMask = 0\n    private var lastSent = -1\n    private var romLoaded = false\n    private var surfaceReady = false\n\n    // Seletor de ROM (Storage Access Framework): o usuário escolhe a própria ROM.\n    private val pickRom = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n        if (uri != null) {\n            try {\n                // Guarda a permissão para reabrir a mesma ROM automaticamente nas próximas vezes.\n                contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)\n            } catch (_: SecurityException) { /* provedor não oferece permissão persistente */ }\n            if (loadRom(uri)) {\n                getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(KEY_ROM, uri.toString()).apply()\n            }\n        }\n    }\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\n        enterImmersive()\n\n        surfaceView = SurfaceView(this).apply { holder.addCallback(this@MainActivity) }\n        overlay = PadOverlay(this, pad)\n\n        val root = FrameLayout(this)\n        val mp = ViewGroup.LayoutParams.MATCH_PARENT\n        root.addView(surfaceView, FrameLayout.LayoutParams(mp, mp, Gravity.CENTER))\n        root.addView(overlay, FrameLayout.LayoutParams(mp, mp))\n        // Mantém a imagem em 4:3 (proporção de tela do SNES), centralizada.\n        root.addOnLayoutChangeListener { _, l, t, r, b, _, _, _, _ -> fitSurface(r - l, b - t) }\n        setContentView(root)\n\n        val dir = filesDir.absolutePath\n        nativeInit(dir, dir)\n\n        // Plug and play: reabre a última ROM; só pede o arquivo na primeira vez.\n        val saved = getSharedPreferences(PREFS, MODE_PRIVATE).getString(KEY_ROM, null)\n        if (saved == null || !loadRom(Uri.parse(saved))) {\n            pickRom.launch(arrayOf(\"*/*\"))\n        }\n    }\n\n    private fun fitSurface(w: Int, h: Int) {\n        if (w <= 0 || h <= 0) return\n        var sw = w\n        var sh = (w * 3f / 4f).toInt()\n        if (sh > h) { sh = h; sw = (h * 4f / 3f).toInt() }\n        val lp = surfaceView.layoutParams as FrameLayout.LayoutParams\n        if (lp.width != sw || lp.height != sh) {\n            lp.width = sw; lp.height = sh; lp.gravity = Gravity.CENTER\n            surfaceView.layoutParams = lp\n        }\n    }\n\n    private fun loadRom(uri: Uri): Boolean {\n        nativeStop()\n        val bytes = try {\n            contentResolver.openInputStream(uri)?.use { it.readBytes() }\n        } catch (_: Exception) { null }\n        romLoaded = bytes != null && nativeLoadRom(bytes)\n        if (!romLoaded) {\n            Toast.makeText(this, \"Não foi possível abrir essa ROM\", Toast.LENGTH_LONG).show()\n            return false\n        }\n        if (surfaceReady) nativeStart()\n        return true\n    }\n\n    /**\n     * Captura multitoque. Reconstruímos a máscara completa a cada evento a partir\n     * de todos os ponteiros ativos; assim, soltar um dedo nunca deixa botão preso.\n     */\n    override fun onTouchEvent(e: MotionEvent): Boolean {\n        if (e.actionMasked == MotionEvent.ACTION_DOWN && pad.isMenu(e.x, e.y)) {\n            pickRom.launch(arrayOf(\"*/*\"))\n            return true\n        }\n        touchMask = when (e.actionMasked) {\n            MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> 0\n            else -> {\n                var m = 0\n                for (i in 0 until e.pointerCount) {\n                    // O ponteiro que acabou de subir ainda aparece neste evento.\n                    if (e.actionMasked == MotionEvent.ACTION_POINTER_UP && i == e.actionIndex) continue\n                    m = m or pad.hit(e.getX(i), e.getY(i))\n                }\n                m\n            }\n        }\n        sendInput()\n        return true\n    }\n\n    /** Controle físico (Bluetooth/USB) e teclado: layout posicional do Xbox -> SNES. */\n    private fun keyToMask(code: Int): Int = when (code) {\n        KeyEvent.KEYCODE_BUTTON_A -> Snes.B\n        KeyEvent.KEYCODE_BUTTON_B -> Snes.A\n        KeyEvent.KEYCODE_BUTTON_X -> Snes.Y\n        KeyEvent.KEYCODE_BUTTON_Y -> Snes.X\n        KeyEvent.KEYCODE_BUTTON_L1 -> Snes.L\n        KeyEvent.KEYCODE_BUTTON_R1 -> Snes.R\n        KeyEvent.KEYCODE_BUTTON_START -> Snes.START\n        KeyEvent.KEYCODE_BUTTON_SELECT -> Snes.SELECT\n        KeyEvent.KEYCODE_DPAD_UP -> Snes.UP\n        KeyEvent.KEYCODE_DPAD_DOWN -> Snes.DOWN\n        KeyEvent.KEYCODE_DPAD_LEFT -> Snes.LEFT\n        KeyEvent.KEYCODE_DPAD_RIGHT -> Snes.RIGHT\n        else -> 0\n    }\n\n    override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {\n        val m = keyToMask(keyCode)\n        if (m == 0) return super.onKeyDown(keyCode, event)\n        keyMask = keyMask or m\n        sendInput()\n        return true\n    }\n\n    override fun onKeyUp(keyCode: Int, event: KeyEvent): Boolean {\n        val m = keyToMask(keyCode)\n        if (m == 0) return super.onKeyUp(keyCode, event)\n        keyMask = keyMask and m.inv()\n        sendInput()\n        return true\n    }\n\n    /** Junta toque + controle e só chama o JNI quando a máscara muda. */\n    private fun sendInput() {\n        val mask = touchMask or keyMask\n        if (mask != lastSent) {\n            lastSent = mask\n            nativeSetInput(mask)          // -> frontend -> snes9x -> $4218/$4219\n            overlay.pressed = mask\n            overlay.invalidate()\n        }\n    }\n\n    // --- SurfaceHolder.Callback --------------------------------------------\n    override fun surfaceCreated(holder: SurfaceHolder) {\n        nativeSetSurface(holder.surface)\n        surfaceReady = true\n        if (romLoaded) nativeStart()\n    }\n\n    override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) = Unit\n\n    override fun surfaceDestroyed(holder: SurfaceHolder) {\n        surfaceReady = false\n        nativeStop()\n        nativeSetSurface(null)\n    }\n\n    override fun onPause() {\n        super.onPause()\n        nativeStop()                      // também grava o save do jogo\n        touchMask = 0; keyMask = 0\n        sendInput()\n    }\n\n    override fun onResume() {\n        super.onResume()\n        enterImmersive()\n        if (romLoaded && surfaceReady) nativeStart()\n    }\n\n    override fun onDestroy() {\n        nativeDestroy()\n        super.onDestroy()\n    }\n\n    private fun enterImmersive() {\n        WindowCompat.setDecorFitsSystemWindows(window, false)\n        WindowInsetsControllerCompat(window, window.decorView).apply {\n            hide(WindowInsetsCompat.Type.systemBars())\n            systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE\n        }\n    }\n}\n",
              "app/src/main/res/values/themes.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">Top Gear</string>\n\n    <style name=\"Theme.TopGear\" parent=\"Theme.AppCompat.NoActionBar\">\n        <item name=\"android:windowBackground\">@android:color/black</item>\n        <item name=\"android:windowFullscreen\">true</item>\n        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>\n    </style>\n</resources>\n",
              "build.gradle.kts": "plugins {\n    id(\"com.android.application\") version \"8.13.0\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"2.2.0\" apply false\n}\n",
              "buscar_snes9x.py": "#!/usr/bin/env python3\n\"\"\"Baixa o código-fonte do snes9x (versão fixa) para app/src/main/cpp/snes9x.\n\nPrecisa de `git` e internet. Roda sozinho pelo criar_projeto.py; só execute à mão\nse a pasta snes9x estiver faltando. Não faz nada se o código já estiver lá.\n\"\"\"\nimport os\nimport shutil\nimport stat\nimport subprocess\nimport sys\n\nREPO = \"https://github.com/snes9xgit/snes9x.git\"\nSHA = \"1bcc369e89f08243e0a462882fb1f3e42e51de3a\"   # versão testada\n\n\ndef _rm_readonly(func, path, _exc):\n    os.chmod(path, stat.S_IWRITE)\n    func(path)\n\n\ndef main(project_dir):\n    dest = os.path.join(project_dir, \"app\", \"src\", \"main\", \"cpp\", \"snes9x\")\n    if os.path.exists(os.path.join(dest, \"libretro\", \"libretro.cpp\")):\n        print(\"snes9x já presente em\", dest)\n        return 0\n    if shutil.which(\"git\") is None:\n        print(\"ERRO: instale o git (ou baixe https://github.com/snes9xgit/snes9x e copie para\", dest + \")\")\n        return 1\n    os.makedirs(dest, exist_ok=True)\n\n    def run(*args):\n        subprocess.run(args, cwd=dest, check=True)\n\n    print(\"Baixando snes9x\", SHA[:8], \"...\")\n    run(\"git\", \"init\", \"-q\")\n    run(\"git\", \"remote\", \"add\", \"origin\", REPO)\n    run(\"git\", \"fetch\", \"-q\", \"--depth\", \"1\", \"origin\", SHA)\n    run(\"git\", \"checkout\", \"-q\", \"FETCH_HEAD\")\n    shutil.rmtree(os.path.join(dest, \".git\"), onerror=_rm_readonly)   # evita repositório aninhado\n    print(\"snes9x pronto.\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1] if len(sys.argv) > 1 else os.path.dirname(os.path.abspath(__file__))))\n",
              "gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nkotlin.code.style=official\n",
              "settings.gradle.kts": "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"TopGear\"\ninclude(\":app\")\n",
          }

          base = "TopGear"
          for rel, content in FILES.items():
              path = os.path.join(base, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content)
          rc = subprocess.call([sys.executable, os.path.join(base, "buscar_snes9x.py"), base])
          if rc != 0:
              sys.exit(rc)
          print("Projeto criado em", os.path.abspath(base))
          PYEOF

